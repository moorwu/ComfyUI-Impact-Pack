[tool:pytest]
; Scopes pytest's rootdir to tests/unit so that running
;   pytest tests/unit
; from the repo root does not walk up to the Impact Pack's
; top-level __init__.py (which imports folder_paths/torch/cv2/
; ComfyUI's `nodes` module and has real side effects when it succeeds).
;
; Without this file, pytest's search for a configfile starts at the
; common ancestor of the given args (tests/unit) and walks upward; it
; finds the repo's pyproject.toml, so rootdir becomes the repo root -
; and because that root directory contains __init__.py, pytest wraps
; it in a `Package` collector node whose setup() imports __init__.py
; before any test in this suite runs (this is why it failed even
; though "tests/unit" was the only path passed on the command line).
;
; A pytest.ini here would be the more common fix, but this repo's
; .gitignore has a blanket `*.ini` rule, so a pytest.ini would never
; be committed. setup.cfg with a [tool:pytest] section is recognized
; by pytest the same way and is not ignored.
;
; Placing this ini-priority file directly in tests/unit makes pytest
; stop its upward search for a configfile right here: rootdir becomes
; tests/unit, and the collection tree therefore never includes the
; repo root at all, so the pack's __init__.py is never imported -
; locally, and equally on a machine where it WOULD import successfully
; (a real ComfyUI environment), since the tree simply never reaches
; that directory.
